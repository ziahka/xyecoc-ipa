name: build-ios

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -project XyecocMail.xcodeproj \
            -scheme XyecocMail \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/XyecocMail.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | xcpretty || true

      - name: Package unsigned .ipa
        run: |
          cd build/XyecocMail.xcarchive/Products/Applications
          mkdir -p Payload
          mv *.app Payload/
          zip -qry "$GITHUB_WORKSPACE/XyecocMail-unsigned.ipa" Payload
          echo "Built:" && ls -lh "$GITHUB_WORKSPACE/XyecocMail-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XyecocMail-unsigned
          path: XyecocMail-unsigned.ipa
          if-no-files-found: error
