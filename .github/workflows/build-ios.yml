name: build-ios

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Silence Homebrew's tap-trust / auto-update warnings during CI.
env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  build:
    runs-on: macos-14
    steps:
      # v5 runs on Node 24 (removes the Node 20 deprecation warning).
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Untap unused third-party taps (silence tap-trust warning)
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew untap hashicorp/tap 2>/dev/null || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -project XyecocMail.xcodeproj \
            -scheme XyecocMail \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/XyecocMail.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned .ipa
        run: |
          cd build/XyecocMail.xcarchive/Products/Applications
          mkdir -p Payload
          mv *.app Payload/
          zip -qry "$GITHUB_WORKSPACE/XyecocMail-unsigned.ipa" Payload
          echo "Built:" && ls -lh "$GITHUB_WORKSPACE/XyecocMail-unsigned.ipa"

      # v5 runs on Node 24 (removes the Node 20 deprecation warning).
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: XyecocMail-unsigned
          path: XyecocMail-unsigned.ipa
          if-no-files-found: error
