# XcodeGen spec — run `xcodegen generate` to produce XyecocMail.xcodeproj.
# Keeps the repo free of a hand-maintained .pbxproj; CI generates it fresh.
name: XyecocMail

options:
  bundleIdPrefix: com.xyecoc
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  XyecocMail:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Xyecoc Mail
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        NSFaceIDUsageDescription: "Используется для быстрой и безопасной разблокировки почтового ящика."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            UIPrerenderedIcon: false
          CFBundleAlternateIcons:
            AppIcon-Dark:
              CFBundleIconFiles:
                - AppIcon-Dark
              UIPrerenderedIcon: false
            AppIcon-Minimalist:
              CFBundleIconFiles:
                - AppIcon-Minimalist
              UIPrerenderedIcon: false
        # NOTE: App Transport Security is left at its secure defaults.
        # Endpoints are HTTPS/WSS, so no NSAppTransportSecurity exceptions
        # are required. Do NOT add NSAllowsArbitraryLoads.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xyecoc.mail
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # Sources/Assets.xcassets/AppIcon.appiconset
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES